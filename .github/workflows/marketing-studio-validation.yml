name: Marketing Studio Validation

on:
  push:
    branches: [main]
    paths:
      - 'src/components/coordinator/MarketingStudio.tsx'
      - 'src/components/coordinator/AnalyticsDashboard.tsx'
      - 'src/services/api.ts'
      - 'server/routes/marketing.ts'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/marketing-studio-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/components/coordinator/MarketingStudio.tsx'
      - 'src/components/coordinator/AnalyticsDashboard.tsx'
      - 'src/services/api.ts'
      - 'server/routes/marketing.ts'
      - 'server.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/marketing-studio-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build frontend
        run: npm run build
