name: Repair coordinator diagnostics lockfile

on:
  push:
    branches:
      - fix/coordinator-live-data-diagnostics
    paths:
      - .github/workflows/repair-coordinator-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostics branch
        uses: actions/checkout@v4
        with:
          ref: fix/coordinator-live-data-diagnostics
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build production frontend
        run: npm run build
      - name: Commit lockfile and remove one-time repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/repair-coordinator-lockfile.yml
          git commit -m "fix(build): regenerate npm lockfile and validate coordinator patch"
          git push origin HEAD:fix/coordinator-live-data-diagnostics
