name: QR feedback PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'firestore.rules'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/qr-feedback-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript type check
        run: npm run lint
      - name: Feedback validation unit tests
        run: npm run test:feedback-validation
      - name: Staff authentication secret tests
        run: npm run test:staff-auth-secret
      - name: Feedback API auth and input smoke tests
        run: npm run test:feedback-api-auth
      - name: Firestore rules static tests
        run: npm run test:firestore-rules
      - name: Production frontend build
        run: npm run build
