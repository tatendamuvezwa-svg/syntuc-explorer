name: Regenerate dependency lockfile
on:
  push:
    branches:
      - fix/authoritative-catalogue-no-fallback-v2
    paths:
      - package.json
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/authoritative-catalogue-no-fallback-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: regenerate npm dependency lockfile"
          git push origin HEAD:fix/authoritative-catalogue-no-fallback-v2
